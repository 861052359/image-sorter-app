name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools;platforms;android-34;build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          echo "84831b9409646a918e30573bab4c9c9130668abd" > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
          echo "e9d15716a6b6e3b0e5a5e5e5e5e5e5e5e5e5e5e5" > $ANDROID_SDK_ROOT/licenses/android-sdk-googletv-license
          echo "33b6a676e5a5e5e5e5e5e5e5e5e5e5e5e5e5e5e5" > $ANDROID_SDK_ROOT/licenses/android-sdk-google-gdk-license
          echo "e9d15716a6b6e3b0e5a5e5e5e5e5e5e5e5e5e5e5" > $ANDROID_SDK_ROOT/licenses/android-sdk-simulator-license
          echo "e9d15716a6b6e3b0e5a5e5e5e5e5e5e5e5e5e5e5" > $ANDROID_SDK_ROOT/licenses/android-sdk-camera-license

      # setup-gradle 自动缓存 ~/.gradle（wrapper 下载 + 依赖 + 构建缓存），
      # 下次构建直接命中缓存，无需重新下载。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSwipe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
